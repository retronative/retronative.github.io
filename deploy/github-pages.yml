# TEMPLATE, inactive: GitHub only runs workflows in .github/workflows/.
# Deploys this site to GitHub Pages from the repository retronative/retronative.github.io.
# To enable (after approval): create that public repository, set Settings > Pages >
# Source to "GitHub Actions", move this file to .github/workflows/, run it once by hand,
# check the result, and only then uncomment the push trigger.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  # push:
  #   branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro check
      - run: npx astro build
      - run: node scripts/check-dist.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
