# Deploys this site to GitHub Pages (https://retronative.github.io/) from
# retronative/retronative.github.io (Settings > Pages > Source: GitHub Actions).
# It runs on every push to main, or by hand (Actions > Deploy to GitHub Pages >
# Run workflow).
name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

# Nothing by default; each job asks for what it needs. Actions are pinned to the
# commit of a release (its tag in the comment), all on the Node 24 runtime.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24   # Astro 7.4 needs Node 22.23.4 or later
          cache: npm
      - run: npm ci
      - run: npx astro check
      - run: npx astro build
      - run: node scripts/check-dist.mjs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
